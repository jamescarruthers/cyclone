<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyclone 3D</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; --fg: #d7d7d7; --dim: #8a8a8a; --key: #ffff00; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg); overflow: hidden; }
  body { display: grid; grid-template-rows: 1fr auto; font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  main { position: relative; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
  #status { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; text-align: center; padding: 16px; }
  #status:empty { display: none; }
  #status span { background: #000c; padding: 8px 14px; border: 1px solid #333; }
  footer { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; justify-content: center; padding: 6px 16px; border-top: 1px solid #222; color: var(--dim); }
  kbd { font: inherit; color: var(--key); }
  button { font: inherit; color: var(--fg); background: #111; border: 1px solid #444; padding: 2px 10px; cursor: pointer; }
  button:hover { border-color: var(--key); }
  button[aria-pressed="true"] { color: #000; background: #00d7d7; border-color: #00d7d7; }
</style>
</head>
<body>
<main>
  <canvas id="cyclone"></canvas>
  <div id="status"><span>Loading…</span></div>
</main>
<footer>
  <span><kbd>1</kbd>/<kbd>Q</kbd> up/down</span>
  <span><kbd>O</kbd>/<kbd>P</kbd> turn</span>
  <span><kbd>X</kbd> thrust</span>
  <span><kbd>N</kbd> view</span>
  <span><kbd>[</kbd>/<kbd>]</kbd> rotate camera</span>
  <span><kbd>M</kbd> map</span>
  <span><kbd>A</kbd>+<kbd>G</kbd> abandon</span>
  <span>menu <kbd>1</kbd>–<kbd>6</kbd> (<kbd>4</kbd> = arrows + right Ctrl)</span>
  <span><kbd>F1</kbd> classic camera</span>
  <button id="wire" type="button" aria-pressed="false" title="Wireframe view (F2)">Wireframe</button>
  <button id="fs" type="button">Fullscreen</button>
</footer>
<script type="module">
  import init, { toggle_wireframe } from "./cyclone.js";
  const canvas = document.getElementById("cyclone");
  const status = document.getElementById("status");
  const say = (text) => { status.innerHTML = text ? `<span>${text}</span>` : ""; };
  // the game reads the keyboard through the canvas, so it needs the focus
  const hint = () => { if (document.activeElement !== canvas) say("Click the game to play"); };
  canvas.addEventListener("pointerdown", () => canvas.focus());
  canvas.addEventListener("focus", () => say(""));
  canvas.addEventListener("blur", hint);
  canvas.addEventListener("contextmenu", (e) => e.preventDefault());
  document.getElementById("fs").addEventListener("click", async () => {
    try { await canvas.requestFullscreen(); } catch (e) { console.warn(e); }
    canvas.focus();
  });
  const wire = document.getElementById("wire");
  wire.addEventListener("click", () => {
    wire.setAttribute("aria-pressed", String(toggle_wireframe()));
    canvas.focus();
  });
  // F2 toggles it in the game too: keep the button in step
  canvas.addEventListener("keydown", (e) => {
    if (e.code === "F2" && !e.repeat) wire.setAttribute("aria-pressed", String(wire.getAttribute("aria-pressed") !== "true"));
  });
  try {
    await init();
    say("");
    canvas.focus();
    setTimeout(hint, 500);
  } catch (e) {
    console.error(e);
    say("This browser could not start the game (it needs WebGPU or WebGL 2).");
  }
</script>
</body>
</html>
